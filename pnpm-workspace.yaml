# pnpm 12 install-script approvals (B12.6: install scripts blocked by
# default; only the native builds we rely on may run, the rest are denied
# explicitly so `pnpm install` never stops to ask).
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  "@parcel/watcher": false
  "@swc/core": false
  unrs-resolver: false

# Security overrides (pnpm audit, 2026-10-06). next pins postcss 8.4.31,
# which has the sourceMappingURL file-read advisories; 8.5 is API-compatible.
overrides:
  postcss: ^8.5.29
  # 2026-11-05: storybook/vitest pull vite 7 <=7.3.6 (launch-editor and
  # fs.allow advisories), glob <=14.0.1 and minimatch <11.0.1 (dev tooling).
  vite: ^7.3.7
